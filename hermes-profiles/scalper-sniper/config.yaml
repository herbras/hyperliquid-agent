# scalper-sniper — 5m setup hunter & entry calculator
# Interactive. User feed pair dari scout, sniper kasih setup + entry/SL/TP.

model:
  default: anthropic/claude-sonnet-4-6
  provider: anthropic

timezone: "UTC"

terminal:
  backend: local
  cwd: "~/.hermes/profiles/scalper-sniper/workspace"
  persistent_shell: true

# Sniper butuh history percakapan (referensi setup yang udah dibahas),
# tapi tetap compress sebelum jadi gemuk.
compression:
  enabled: true
  threshold: 0.55
  target_ratio: 0.25
  protect_last_n: 25

agent:
  reasoning_effort: medium    # mikir Setup A vs B vs C, validasi confluence
  max_turns: 60
  disabled_toolsets:
    - voice

tool_output:
  max_bytes: 40000
  max_lines: 1500

memory:
  memory_enabled: true
  user_profile_enabled: true   # remember user's risk tolerance, account size
  memory_char_limit: 2200

display:
  tool_progress: all
  show_cost: true
  show_reasoning: false        # reasoning bocor ke trader = paralysis

skills:
  config:
    scalper-knowledge:
      strategi_path: "~/Documents/panduan-openclaw/hyperliquid/STRATEGI-15M.md"
      lessons_path: "~/.hermes/profiles/scalper-journal/state/LESSONS.md"
    lux-algo-smc:
      playbook_path: "~/Documents/panduan-openclaw/hyperliquid/STRATEGI-15M.md"   # 15m sekarang, bukan 5m
    crypto-trader-signals:
      enabled: true
    market-data-cron:
      script_path: "~/Documents/panduan-openclaw/hyperliquid/data/fetch_market_data.py"
      exchange: "binanceusdm"
      timeframe: "15m"   # execution frame

quick_commands:
  fetch15m:
    type: exec
    command: "TF=15m python3 ${HL_REPO:-~/Documents/panduan-openclaw/hyperliquid}/data/fetch_market_data.py"
  fetch15m-bybit:
    type: exec
    command: "TF=15m python3 ${HL_REPO:-~/Documents/panduan-openclaw/hyperliquid}/data/fetch_bybit.py"
  fetch15m-hl:
    type: exec
    command: "TF=15m python3 ${HL_REPO:-~/Documents/panduan-openclaw/hyperliquid}/data/fetch_hyperliquid.py"
  skip:
    type: alias
    target: "/note SKIP — sebut alasannya"

  # === Execution helpers (default DRY-RUN) ===
  preflight:
    type: exec
    command: "python3 ${HL_REPO:-~/Documents/panduan-openclaw/hyperliquid}/trade/bybit_execute.py preflight"
  position:
    type: exec
    command: "python3 ${HL_REPO:-~/Documents/panduan-openclaw/hyperliquid}/trade/bybit_execute.py position --pair ${PAIR:-BTCUSDT}"

# Smart approval — sniper ga boleh execute trade real, tapi kalau nanti
# disambungin ke broker API, prompt sebelum order.
approvals:
  mode: smart
