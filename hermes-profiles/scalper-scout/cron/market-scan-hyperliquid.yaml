# Varian Hyperliquid native — pakai ini ALIH-ALIH market-scan.yaml kalau
# mau pure HL data (bukan Binance). Cron yang sama, schedule sama, tapi
# script & env beda.

name: market-scan-15m-hl
description: "Hyperliquid native: 1h bias scan, Asia + US window only"
schedule: "*/15 0-3,13-16 * * 1-5"   # Asia (00-03 UTC) + US (13-16 UTC), Sen-Jum
timezone: UTC

script:
  command: python3
  args:
    - "{{ env.HL_REPO }}/data/scan_with_feed.py"
  env:
    HL_REPO:          "{{ env.HL_REPO | default('~/Documents/panduan-openclaw/hyperliquid') }}"
    DATA_SOURCE:      "hl"
    COINS:            "{{ env.COINS | default('BTC,ETH,SOL,HYPE') }}"
    TF:               "1h"
    CANDLES:          "48"
    TELEGRAM_CHANNEL: "{{ env.TELEGRAM_CHANNEL | default('marketfeed') }}"
    TELEGRAM_HOURS:   "4"
    TELEGRAM_LIMIT:   "8"
  timeout: 60

prompt: |
  Snapshot terdiri dari 2 section:
  1. `market` → 1h bias frame Hyperliquid (price, FR, OI, EMA21, FVG)
  2. `feed`   → Telegram channel @marketfeed news 4 jam terakhir
               (kosong / "skipped" kalau credentials belum set)

  Klasifikasikan tiap coin per SOUL kamu — be selective, hanya fire
  GO-LONG/GO-SHORT untuk Setup A candidate yang jelas.

  Window saat ini: {{ now.hour < 4 ? 'ASIA (Tokyo open)' : 'US (NY core)' }}.
  Pair preferensi: {{ now.hour < 4 ? 'SOL > HYPE > pair retail Asia' : 'SOL > BTC > ETH (per backtest)' }}.

  Cek `feed` untuk catalyst fundamental (CPI release, Fed speak, exchange
  news, hack, listing, dst). Kalau ada news high-impact dalam 1 jam terakhir,
  PAUSE — tunggu volatilitas reda dulu sebelum entry.

  Funding HL = per-jam (sudah diskalakan di script). Field `open_interest`
  per coin: naik OI + price up = konfirmasi trend; turun OI + price up =
  short squeeze (less reliable).

  {{ script.stdout }}

guards:
  - file_exists_skip: "~/.hermes/profiles/scalper-journal/HALT.flag"
  - file_exists_skip: "~/.hermes/profiles/scalper-scout/PAUSE.flag"

notify:
  - type: log
    path: "~/.hermes/profiles/scalper-scout/logs/scans-hl.log"

  - type: shell
    when: "'GO-LONG' in agent.response or 'GO-SHORT' in agent.response"
    command: |
      echo "{{ agent.response | quote }}" | \
        TELEGRAM_BOT_TOKEN="{{ env.TELEGRAM_BOT_TOKEN }}" \
        TELEGRAM_CHAT_ID="{{ env.TELEGRAM_CHAT_ID }}" \
        python3 "{{ env.HL_REPO }}/notify/notify_telegram.py" --prefix "🟣 SCOUT-HL 15m\n\n"
