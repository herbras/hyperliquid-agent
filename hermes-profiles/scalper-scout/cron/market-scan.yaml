# Scan tiap 15 menit, HANYA di Asia + US window per STRATEGI-15M.md.
# Asia: 00-03 UTC (07-11 WIB), US: 13-16 UTC (20-00 WIB). Senin-Jumat.
# Sisanya silent — be good, be wide, don't watch the chart all day.

name: market-scan-15m
description: "Bias 1h + setup hunt 15m. Fire alert hanya saat ada GO-LONG/SHORT."
schedule: "*/15 0-3,13-16 * * 1-5"   # 15m sync candle close, Asia + US window
timezone: UTC

# Run scan_with_feed.py: combine market data (ccxt fallback chain) + telegram
# news feed. Output JSON dengan dua section: `market` + `feed`.
script:
  command: python3
  args:
    - "{{ env.HL_REPO }}/data/scan_with_feed.py"
  env:
    HL_REPO:           "{{ env.HL_REPO | default('~/Documents/panduan-openclaw/hyperliquid') }}"
    DATA_SOURCE:       "ccxt"
    EXCHANGE:          "{{ env.EXCHANGE          | default('htx') }}"
    EXCHANGE_FALLBACK: "{{ env.EXCHANGE_FALLBACK | default('gate,hyperliquid') }}"
    SYMBOLS:           "{{ env.SYMBOLS  | default('BTC/USDT,ETH/USDT,SOL/USDT,XRP/USDT') }}"
    TF:                "1h"
    TELEGRAM_CHANNEL:  "{{ env.TELEGRAM_CHANNEL | default('marketfeed') }}"
    TELEGRAM_HOURS:    "4"
    TELEGRAM_LIMIT:    "8"
  timeout: 60

prompt: |
  Snapshot 2 section:
  1. `market` → 1h bias frame (price, FR, EMA21, FVG, macro_bias)
  2. `feed`   → @marketfeed Telegram news 4 jam terakhir
                ("skipped" kalau credentials belum set — non-blocking)

  Klasifikasikan tiap pair per SOUL kamu. Window {{ now.hour < 4 ? 'ASIA' : 'US' }} —
  pair priority {{ now.hour < 4 ? 'SOL > HYPE > XRP/BNB' : 'SOL > BTC > ETH' }}.

  Hanya fire GO-LONG/GO-SHORT kalau Setup A candidate jelas. Cek `feed` —
  kalau ada news high-impact (CPI/Fed/hack/listing) dalam 1h terakhir,
  PAUSE jangan trade dulu sampai volatilitas reda.

  {{ script.stdout }}

# Filter: jangan trigger kalau lagi 2-SL halt atau event window
guards:
  - file_exists_skip: "~/.hermes/profiles/scalper-journal/HALT.flag"
  - file_exists_skip: "~/.hermes/profiles/scalper-scout/PAUSE.flag"

# Output ke mana — agent.response di-pipe ke notify_telegram.py
notify:
  - type: log
    path: "~/.hermes/profiles/scalper-scout/logs/scans.log"

  # Telegram alert: kirim agent response (klasifikasi bias) ke chat.
  # Hanya fire kalau ada minimal 1 GO-LONG atau GO-SHORT (skip-only scan = silent).
  - type: shell
    when: "'GO-LONG' in agent.response or 'GO-SHORT' in agent.response"
    command: |
      echo "{{ agent.response | quote }}" | \
        TELEGRAM_BOT_TOKEN="{{ env.TELEGRAM_BOT_TOKEN }}" \
        TELEGRAM_CHAT_ID="{{ env.TELEGRAM_CHAT_ID }}" \
        python3 "{{ env.HL_REPO }}/notify/notify_telegram.py" --prefix "🎯 SCOUT 15m\n\n"
