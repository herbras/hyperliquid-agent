# scalper-coach — agent aktif berbasis knowledge base
# Baca: STRATEGI-15M.md, CATATAN.md, lux-algo-guide, LESSONS.md, trade-history
# Aktif via cron: pre-session briefing, post-session debrief, weekly review

model:
  default: anthropic/claude-sonnet-4-6   # butuh reasoning untuk synthesize KB + history
  provider: anthropic

timezone: "UTC"

terminal:
  backend: local
  cwd: "~/.hermes/profiles/scalper-coach/workspace"
  persistent_shell: true

# Coach butuh context window besar — baca beberapa doc panjang sekaligus
compression:
  enabled: true
  threshold: 0.65
  target_ratio: 0.30
  protect_last_n: 30

agent:
  reasoning_effort: medium
  max_turns: 50
  disabled_toolsets:
    - voice

tool_output:
  max_bytes: 60000   # KB documents bisa besar
  max_lines: 2500

# Memory penting untuk coach — track pola trading user across sessions
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 4000

display:
  tool_progress: new
  show_cost: true

# File konteks — auto-loaded ke setiap conversation coach
# Coach BUTUH baca knowledge base setiap kali dipanggil
file_read_max_chars: 200000

skills:
  config:
    lux-algo-smc:
      playbook_15m_path: "~/Documents/panduan-openclaw/hyperliquid/STRATEGI-15M.md"
      playbook_5m_path: "~/Documents/panduan-openclaw/hyperliquid/lux-algo-guide-verified-v2.md"
      catatan_path: "~/Documents/panduan-openclaw/hyperliquid/hermes-profiles/CATATAN.md"
      lessons_path: "~/.hermes/profiles/scalper-journal/state/LESSONS.md"
      history_path: "~/.hermes/profiles/scalper-journal/state/trade-history.jsonl"

quick_commands:
  brief:
    type: alias
    target: "/note Generate pre-session briefing untuk window berikutnya"
  debrief:
    type: alias
    target: "/note Generate post-session debrief untuk session yang baru selesai"
  weekly:
    type: alias
    target: "/note Generate weekly review dari trade-history.jsonl"
  ask:
    type: alias
    target: "/note Knowledge base query — jawab dengan citation dari STRATEGI-15M.md atau lux-algo-guide"
  upcoming:
    type: exec
    command: "python3 ${HL_REPO:-~/Documents/panduan-openclaw/hyperliquid}/events/economic_calendar.py upcoming 24"
  stats:
    type: exec
    command: "python3 ${HL_REPO:-~/Documents/panduan-openclaw/hyperliquid}/journal/position_write.py stats week"
  test-tg:
    type: exec
    command: |
      echo "📱 Coach test from scalper-coach — $(date -u +%FT%TZ)" | \
        python3 ${HL_REPO:-~/Documents/panduan-openclaw/hyperliquid}/notify/notify_telegram.py --plain
